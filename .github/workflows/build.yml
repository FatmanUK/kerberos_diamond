name: Build

on:
  push:
    branches:
      - mother
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
        fetch-tags: true
        submodules: false

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.26.5'

    - name: Install dependencies
      run: go mod download

    - name: Build both binaries
      run: make all

    - name: Build the KDC container image
      run: make pod-build

    - name: Build the proxy container image
      run: make pod-proxy-build
